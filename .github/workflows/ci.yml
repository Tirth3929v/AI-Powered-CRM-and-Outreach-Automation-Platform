name: CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-checks:
    name: Backend & AI Quality Checks
    runs-on: ubuntu-latest
    env:
      CAMPAIGN_TEST_DATABASE_URL: postgresql://campaign_ci:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5433/campaign_test
    services:
      campaign-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campaign_ci
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: campaign_test
        ports:
          - '127.0.0.1:5433:5432'
        options: >-
          --health-cmd "pg_isready -U campaign_ci -d campaign_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install pytest flake8

      - name: Check Python linting
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app ai/ automation/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend/app ai/ automation/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Apply migrations to the campaign test database
        run: |
          for migration in database/migrations/*.sql; do
            psql "$CAMPAIGN_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run Backend & AI Unit Tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://crm_user:crm_password@localhost:5432/crm_db
          SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
          GEMINI_MOCK_MODE: "true"
          EMAIL_VERIFIER_SANDBOX: "true"
          EMAIL_SANDBOX_MODE: "true"
          ENRICHMENT_SANDBOX: "true"
        run: |
          python -m pytest -v backend/tests ai/evals/ci_eval.py --ignore=backend/tests/manual

  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build React application
        run: npm run build
